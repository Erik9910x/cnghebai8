<style>
:root{--bg:#0c0c0d;--bg2:#161617;--ink:#f1eee7;--dim:#8d8a83;--line:#2a2a2c;--ac:#ff5a36;--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eee7;--bg2:#e6e2d8;--ink:#121212;--dim:#6d6a63;--line:#d3cec1;--ac:#e0391a}}

*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
#view{position:fixed;inset:0 0 64px 0;display:grid;place-items:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center;flex:none;--mx:0;--my:0}
.s{position:absolute;inset:0;padding:64px 96px;display:flex;flex-direction:column;justify-content:center;visibility:hidden;pointer-events:none}
.s.on{visibility:visible;pointer-events:auto}
.s .r{opacity:0;transform:translateY(28px);filter:blur(6px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.s.on .r{opacity:1;transform:none;filter:none}
.s.out .r,.s.out .w i{opacity:0;transition-duration:.3s;transform:translateY(-12px)}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .1em}
.w i{display:inline-block;font-style:inherit;transform:translateY(105%) rotate(5deg);transition:transform 1s var(--ease) var(--d)}
.s.on .w i{transform:none}
.k{font:700 13px "Be Vietnam Pro",sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin-bottom:20px}
h1,h2{font-family:"Newsreader",Georgia,serif;font-weight:400;letter-spacing:-.02em;line-height:1}
h1{font-size:176px}h2{font-size:84px;max-width:980px}
h2 em,h1 em{color:var(--ac);font-style:italic}
.sub{font-size:26px;color:var(--dim);margin-top:24px;max-width:700px}
.chk{color:var(--dim);font-size:16px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px;max-width:900px}
.chk b{color:var(--ac)}
.lay-cover .tag{position:absolute;left:96px;bottom:64px;color:var(--dim);font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.lay-cover:after{content:"";position:absolute;right:-120px;top:50%;width:520px;height:520px;margin-top:-260px;border:1px solid var(--ac);border-radius:50%;opacity:.35;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.12}}
.bg-n{position:absolute;right:60px;bottom:10px;font:400 340px/1 "Newsreader",serif;color:var(--bg2);z-index:-1;user-select:none;transform:translate(calc(var(--mx)*-16px),calc(var(--my)*-10px))}
.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.chips span{border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:16px;color:var(--dim)}
.chips b{color:var(--ink);font-weight:700}
.caret:after{content:"";display:inline-block;width:5px;height:.8em;background:var(--ac);margin-left:8px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.tl{display:grid;grid-template-columns:repeat(5,1fr);margin-top:36px;max-width:640px;position:relative;gap:6px}
.tl:before{content:"";position:absolute;left:0;top:7px;height:2px;width:0;background:var(--ac);transition:width 1.8s var(--ease) .6s}
.s.on .tl:before{width:100%}
.tl div{padding-top:24px;position:relative;font-size:14px;line-height:1.35;color:var(--dim)}
.tl div:before{content:"";position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--ac)}
.tl b{display:block;font:400 30px "Newsreader",serif;color:var(--ink)}
.pt{position:absolute;right:70px;bottom:0;width:470px;transform:translate(calc(var(--mx)*14px),calc(var(--my)*8px))}
.pt:before{content:"";position:absolute;left:50%;top:44%;width:420px;height:420px;margin:-210px;border-radius:50%;border:1px dashed var(--ac);animation:spin 40s linear infinite}
.pt:after{content:"";position:absolute;left:50%;top:44%;width:340px;height:340px;margin:-170px;border-radius:50%;background:var(--ac);opacity:.16}
@keyframes spin{to{transform:rotate(360deg)}}
.pt img{position:relative;z-index:1;width:100%;display:block;filter:grayscale(1) contrast(1.05);mask-image:linear-gradient(#000 82%,transparent)}
.pt q{position:absolute;z-index:2;left:-60px;bottom:90px;max-width:280px;font:italic 400 30px/1.1 "Newsreader",serif;quotes:none;background:var(--bg);padding:14px 18px;border-left:3px solid var(--ac)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:28px;margin-top:38px}
.cols div{border-top:2px solid var(--line);padding-top:16px;font-size:19px;line-height:1.4;transition:border-color .5s}
.s.on .cols div{border-color:var(--ac)}
.cols b{display:block;font:400 34px "Newsreader",serif;margin:4px 0 6px}
.cols small{font:700 12px "Be Vietnam Pro";letter-spacing:.18em;color:var(--ac)}
.cols p{color:var(--dim)}
.flow{display:flex;margin-top:48px;position:relative}
.flow:before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:var(--ac);transition:width 2s var(--ease) .5s}
.s.on .flow:before{width:100%}
.flow div{flex:1;padding:24px 18px 0 0;border-top:2px solid var(--line);font-size:19px}
.flow b{display:block;font:400 40px "Newsreader",serif;color:var(--ac)}
.flow small{display:block;font:700 12px "Be Vietnam Pro";letter-spacing:.18em;color:var(--dim);margin-bottom:4px}
.cards{position:absolute;right:56px;top:80px;bottom:80px;display:flex;gap:22px;align-items:center}
.tw{filter:drop-shadow(0 18px 28px rgba(0,0,0,.45));transition:transform .6s var(--ease)}
.tw:hover{transform:translateY(-8px) rotate(0deg)!important}
.tc{width:236px;background:#f4f1ea;color:#1a1a1a;display:flex;flex-direction:column;overflow:hidden;padding:20px 14px 12px}
.tc .ph{height:330px;display:grid;place-items:center;overflow:hidden}
.tc img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block;mix-blend-mode:multiply}
.tc cite{font:400 28px/1 "Newsreader",serif;font-style:normal;text-align:center;margin-top:12px}
.tc small{display:block;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7a766d;margin-top:4px}
.s .tw.r{transform:translateY(60px) rotate(var(--rot,0deg)) scale(.94)}
.s.on .tw.r{transform:rotate(var(--rot,0deg))}
.slot{position:absolute;right:96px;top:90px;bottom:90px;width:480px;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--dim);font-size:14px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:16px;background:linear-gradient(160deg,var(--bg2),transparent);cursor:pointer;overflow:hidden}
.slot.over{border-color:var(--ac);color:var(--ac)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot.has{padding:0;border-style:solid}
.qz{display:grid;gap:14px;margin-top:34px;max-width:980px}
.qz div{display:grid;grid-template-columns:1fr 170px;gap:24px;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:23px}
.qz button{font:700 13px "Be Vietnam Pro";letter-spacing:.12em;text-transform:uppercase;color:var(--ac);background:none;border:1px solid var(--ac);border-radius:99px;padding:10px;cursor:pointer}
.qz p{grid-column:1/-1;font-size:18px;color:var(--dim);max-height:0;overflow:hidden;opacity:0;transition:.6s var(--ease)}
.qz .show p{max-height:80px;opacity:1}
.qz .show button{background:var(--ac);color:var(--bg)}
.src{columns:2;gap:40px;margin-top:30px;font-size:16px;max-width:1000px;color:var(--dim)}
.src p{margin-bottom:10px;break-inside:avoid}.src b{color:var(--ink);font-weight:500}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--ac);width:0;transition:width .6s var(--ease);z-index:6;margin-top:env(safe-area-inset-top,0px)}
#nav{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:16px;z-index:6}
#nav button,#tools button{all:unset;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--bg2);font-size:20px;transition:.3s var(--ease)}
#nav button:hover,#tools button:hover{border-color:var(--ac);color:var(--ac);transform:translateY(-2px)}
#nav button:disabled{opacity:.3;pointer-events:none}
#cnt{font-variant-numeric:tabular-nums;letter-spacing:.14em;font-size:14px;color:var(--dim);min-width:84px;text-align:center}
#tools{position:fixed;right:20px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
#tools button{width:40px;height:40px;font-size:16px}
#hint{position:fixed;left:24px;bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--dim);z-index:6}
#notes{position:fixed;left:0;right:0;bottom:64px;background:var(--bg2);border-top:1px solid var(--line);padding:16px 24px;font-size:16px;line-height:1.55;transform:translateY(130%);transition:transform .5s var(--ease);z-index:7;max-height:36vh;overflow:auto}
#notes.on{transform:none}
#ov{position:fixed;inset:0;background:var(--bg);z-index:8;padding:40px;overflow:auto;display:none;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-content:start}
#ov.on{display:grid}
#ov button{all:unset;cursor:pointer;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;padding:14px;font:400 22px/1.1 "Newsreader",serif;display:flex;flex-direction:column;justify-content:flex-end;transition:.3s var(--ease);background:var(--bg2)}
#ov button:hover,#ov button.cur{border-color:var(--ac);transform:translateY(-3px)}
#ov small{font:500 11px "Be Vietnam Pro";color:var(--ac);letter-spacing:.15em;margin-bottom:6px}
@media (max-width:700px){#hint{display:none}#tools{display:none}}
@media (prefers-reduced-motion:reduce){.s .r,.w i{transition:none;filter:none}#bar,.pt:before,.lay-cover:after{animation:none;transition:none}}
:root{--sf:"Newsreader",Georgia,"Times New Roman",serif;--sn:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
body{font-family:var(--sn)}
h1{font-size:168px}h2{font-size:76px;max-width:1000px;line-height:1.02}

.s .r{filter:none;transition:opacity .8s var(--ease),transform .9s cubic-bezier(.16,1,.3,1)}
.w i{transition:transform .9s cubic-bezier(.16,1,.3,1) var(--d)}
#wipe{position:fixed;inset:0;background:var(--ac);z-index:5;clip-path:inset(0 100% 0 0);pointer-events:none}

#wipe.bw{animation:wb .75s cubic-bezier(.76,0,.24,1)}
@keyframes wf{0%{clip-path:inset(0 100% 0 0)}45%,55%{clip-path:inset(0)}100%{clip-path:inset(0 0 0 100%)}}

#net{position:fixed;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}

#geo svg{position:fixed;color:var(--ac);opacity:.22;pointer-events:none;stroke:currentColor;fill:none;stroke-width:1}

.lay-game,.lay-dnd,.lay-demo{justify-content:flex-start;padding-top:42px}

{lay:"cover",k:"Giới thiệu chung về Công nghệ",h:"No <em>Job</em>",sub:"Từ “Steve Jobs Việt Nam” đến kỷ nguyên AI.",tag:"Nhóm No Job · Technology",note:"Chào thầy cô và các bạn, tụi mình là nhóm No Job. Hôm nay mình đi một vòng: từ một câu hỏi từng gây tranh luận trong đề thi, qua người đã làm công nghệ trở nên dễ dùng, đến AI, và cuối cùng là hai sản phẩm nhóm tự làm."},
{lay:"exam",k:"Đề Ngữ văn · Tốt nghiệp THPT 2026",h:"“Làm thế nào để có những <em>Steve Jobs</em> Việt Nam?”",chips:["Ngày <b>11/6/2026</b>","<b data-c=\"1223776\">0</b> thí sinh đăng ký","Phần Viết · nghị luận xã hội"],chk:"<b>Bộ GD-ĐT giải thích:</b> “Steve Jobs Việt Nam” là cách diễn đạt mang tính ẩn dụ, ở câu hỏi phân hóa đánh giá tư duy và lập luận.",note:"Sáng 11/6/2026, hơn 1,2 triệu thí sinh làm bài Ngữ văn, và câu nghị luận xã hội hỏi: làm thế nào để có những “Steve Jobs Việt Nam”. Đề gây tranh luận rất nhiều. Bộ GD-ĐT giải thích đó là cách nói ẩn dụ để đánh giá tư duy, lập luận. Nên câu hỏi hôm nay của tụi mình là: Steve Jobs thật sự là ai, và ta học được gì từ ông? [Nguồn: Báo Đại biểu Nhân dân, SGGP 12–13/6/2026]"},
{lay:"jobs",k:"Nhân vật",h:"Steve <em>Jobs</em>",sub:"Người không phát minh ra smartphone, nhưng khiến cả thế giới muốn dùng nó.",tl:[["1976","Lập Apple cùng Wozniak, tuổi 21"],["1997","Trở lại Apple"],["2005","Diễn văn Stanford"],["2007","Giới thiệu iPhone"],["2011","Qua đời"]],q:"Stay hungry. Stay foolish.",note:"Năm 1976, Jobs cùng Steve Wozniak lập Apple khi mới 21 tuổi. Ông thất bại, rời công ty, lập NeXT, rồi năm 1997 quay lại. Năm 2007 ông giới thiệu iPhone. Điều đáng chú ý: ông không phải người phát minh ra điện thoại thông minh. Cái ông làm giỏi là biến công nghệ phức tạp thành thứ ai cũng dùng được. Câu “Stay hungry. Stay foolish.” ở cuối bài diễn văn Stanford 2005; ông nói đó là lời trên bìa một tạp chí ông từng đọc. [Nguồn: Tiền Phong 2026; Stanford News 2005]"},
{lay:"cols",k:"Tư duy sản phẩm",h:"Ba điều Jobs để lại, <em>không phải</em> phép màu",items:[["01","Đơn giản","Giấu sự phức tạp đi, để người dùng chỉ thấy việc họ cần làm."],["02","Trải nghiệm","Sản phẩm tốt bắt đầu từ cảm giác khi cầm, chạm, dùng, không chỉ từ thông số."],["03","Kết nối","Stanford 2005: “connecting the dots”, trải nghiệm rời rạc sau này nối thành hướng đi."]],chk:"<b>Giữ tỉnh táo:</b> thành công không phải của một người; Jobs làm việc cùng cả đội ngũ và cũng từng thất bại.",note:"Mình rút ra ba điều. Một: đơn giản, đừng bắt người dùng học cách dùng máy. Hai: trải nghiệm quan trọng hơn thông số. Ba: kết nối những điều tưởng rời rạc, đúng tinh thần connecting the dots trong bài Stanford. Nhưng cũng cần tỉnh táo: không ai làm nên công nghệ một mình. Vậy còn nhóm tụi mình thì sao? Xin giới thiệu."},
{lay:"trio",k:"Cold open",h:"Steve Jobs meets <em>No Job</em>",p:["Hai thành viên · một cái tên hơi “thất nghiệp”","Nhưng chúng mình chọn tự tạo ra việc để làm."],note:"Hai bạn đây là hai thành viên, một người là Blow Jobs (Senior), một người là Hand Jobs (Junior). Nhóm tên No Job nghe như thất nghiệp, nhưng tụi mình hiểu theo hướng khác: không ngồi đợi ai giao việc, tự tạo ra việc. Vậy điều gì khiến một công nghệ đáng nhớ? Mình đi qua lịch sử một chút."},
{lay:"flow",k:"Tiến hóa",h:"Máy tính học cách <em>hiểu ta</em>",steps:[["1984","Máy tính cá nhân","Giao diện đồ họa, chuột"],["1990s","Web","Internet cho đại chúng"],["2007","Smartphone","Chạm là dùng"],["2008","App & Cloud","Hệ sinh thái ứng dụng"],["2022","AI tạo sinh","Ra lệnh bằng ngôn ngữ"]],note:"Ban đầu ta phải học cách ra lệnh cho máy. Giao diện đồ họa cho ta chuột, Web nối mọi người, smartphone cho ta chạm, App Store tạo hệ sinh thái, và gần đây AI tạo sinh cho phép ta nói chuyện bằng ngôn ngữ thường ngày. [Mốc năm: Macintosh 1984, iPhone 2007, App Store 2008, ChatGPT 2022: CẦN KIỂM TRA lại nguồn khi chốt]"},
{lay:"flow",k:"AI",h:"AI là gì, hoạt động <em>ra sao</em>?",steps:[["01","Dữ liệu","Văn bản, ảnh, mã"],["02","Học mẫu","Tìm quy luật"],["03","Yêu cầu","Bạn đưa prompt"],["04","Tạo đầu ra","Dự đoán điều hợp lý"],["05","Người kiểm tra","Bước không được bỏ"]],chk:"<b>AI tạo sinh</b> viết nghe rất tự tin nhưng vẫn có thể sai hoặc bịa. Nó không có ý thức.",note:"AI học từ lượng dữ liệu rất lớn để tìm mẫu. Khi bạn đưa yêu cầu, nó tạo ra câu trả lời có vẻ hợp lý nhất. Vì thế đôi khi nó trả lời rất tự tin mà vẫn sai. Bước cuối, con người kiểm tra, là bước quan trọng nhất."},
{lay:"cols",k:"Ứng dụng",h:"AI trong đời sống & <em>công việc</em>",items:[["HỌC","Học tập","Giải thích lại bài, gợi ý dàn ý.","Kiểm tra: nguồn và số liệu."],["TẠO","Sáng tạo","Ý tưởng, hình ảnh, nội dung.","Kiểm tra: bản quyền, độ độc đáo."],["CODE","Lập trình","Gợi ý mã, tìm lỗi.","Kiểm tra: chạy thử, bảo mật."],["DỊCH","Ngôn ngữ","Dịch, tóm tắt tài liệu.","Kiểm tra: sắc thái, nghĩa."]],note:"Mỗi nhóm ứng dụng có một việc AI giúp được và một việc con người phải kiểm tra. Demo ấn tượng chưa chắc là hiệu quả đã đo lường, nên mình luôn kèm bước kiểm chứng."},
{lay:"cols",k:"Tương lai",h:"AI sẽ đi <em>về đâu</em>?",items:[["HÔM NAY","Đang thấy","Trợ lý viết, dịch, lập trình, tóm tắt."],["XU HƯỚNG","Đang phát triển","Đa phương thức (chữ, ảnh, âm thanh), tự động hóa quy trình."],["CÒN MỞ","Câu hỏi","Thông tin sai lệch, quyền riêng tư, bản quyền, tác động đến việc học."]],chk:"<b>Tách bạch:</b> sự thật · xu hướng · dự đoán. Chưa ai biết chắc mốc thời gian.",note:"Mình chia ba lớp: điều đang xảy ra, xu hướng có bằng chứng, và câu hỏi còn mở. Dự đoán chỉ là dự đoán, không nên nói như sự thật. [Có thể thêm số liệu Stanford HAI AI Index, ghi rõ năm]"},
{lay:"slot",k:"Dự án 01",h:"Monokuro<em>Study</em>",p:["Môi trường học yên tĩnh, tập trung","Timer · nhạc · lyrics đồng bộ · thư giãn","FocusX · VibraX · Cinechill"],slot:"Thả screenshot thật vào đây",key:"m1",chk:"<b>monostudy.vercel.app</b> · chỉ nói tính năng đã kiểm tra trực tiếp.",note:"Dự án đầu tiên là MonokuroStudy: không gian học tập yên tĩnh, có bộ đếm giờ, nhạc, lời bài hát đồng bộ và khu thư giãn sau khi học. [Demo ngắn: bắt đầu một phiên tập trung. NHÓM BỔ SUNG vấn đề → ý tưởng → bài học]"},
{lay:"slot",k:"Dự án 02",h:"Meridian <em>Tarot</em>",p:["Nhập câu hỏi → trải bài → tương tác","Trải nghiệm chiêm nghiệm, không dự đoán tương lai","Không nói là AI nếu chưa xác nhận"],slot:"Thả screenshot thật vào đây",key:"m2",chk:"<b>meridian-tarot.vercel.app</b> · giải trí và tự suy ngẫm.",note:"Dự án thứ hai là Meridian Tarot, một trải nghiệm tương tác về biểu tượng. Tụi mình định vị nó là chiêm nghiệm, giải trí, không phải dự đoán tương lai. [Demo: nhập một câu hỏi không nhạy cảm. NHÓM XÁC NHẬN công nghệ thật sự đứng sau]"},
{lay:"cols",k:"Hành trình",h:"Từ ý tưởng đến <em>sản phẩm</em>",items:[["01","Ý tưởng","[Nhóm điền: vấn đề thật đã gặp]"],["02","Thử nghiệm","[Nhóm điền: bản nháp, phản hồi]"],["03","Xây dựng","[Nhóm điền: công cụ, vai trò của AI]"],["04","Bài học","[Nhóm điền: một lỗi thật, giới hạn]"]],chk:"<b>Trung thực:</b> không bịa số liệu người dùng hay kiến trúc.",note:"Đây là quy trình thật của nhóm. [Điền cụ thể] Khi nói về AI, tụi mình phân biệt phần người làm, phần công cụ hỗ trợ và phần chưa hoàn thiện."},
{lay:"quiz",k:"Tương tác · Đúng hay sai?",h:"Thử <em>tỉnh táo</em> nhé",qs:[["Steve Jobs là người phát minh ra điện thoại thông minh.","SAI. Smartphone có trước; iPhone 2007 thành công nhờ trải nghiệm dễ dùng."],["AI trả lời tự tin thì chắc chắn đúng.","SAI. AI có thể sai hoặc bịa mà vẫn viết rất trôi chảy."],["“Stay hungry. Stay foolish.” là câu Jobs tự nghĩ ra.","SAI. Ông nói mình trích lại từ bìa một tạp chí, trong bài Stanford 2005."]],note:"Giơ tay giúp mình: ai chọn đúng, ai chọn sai? Bấm “Hiện đáp án” để mở từng câu và giải thích ngắn. Mục tiêu là tập thói quen kiểm chứng, không phải đánh đố."},
{lay:"end",k:"Kết",h:"Đừng chỉ dùng công nghệ.<br>Hãy <em>tạo ra</em> thứ gì đó.",sub:"No Job: không đợi ai giao việc. Còn bạn, sẽ tạo ra điều gì?",note:"Công nghệ mở ra khả năng, tư duy con người chọn mục tiêu, và thực hành biến ý tưởng thành sản phẩm. Chúng mình tên No Job vì muốn tự tạo ra việc. Cảm ơn thầy cô và các bạn."},

 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
 (function f(){x.clearRect(0,0,W,H);x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--ac");
  P.forEach(p=>{p.y-=p.v*16;if(p.y<0)p.y=1;x.globalAlpha=.5;x.beginPath();x.arc(p.x*W,p.y*H,p.r,0,7);x.fill()});requestAnimationFrame(f)})()})();
go((parseInt(location.hash.slice(1))||1)-1);
</script>
